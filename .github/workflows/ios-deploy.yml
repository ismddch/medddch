name: iOS Deploy to TestFlight

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy-ios:
    name: Build & Upload to TestFlight
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      # ── 1. Source ────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Xcode ─────────────────────────────────────────────────────────────
      - name: Select Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      # ── 3. Flutter ───────────────────────────────────────────────────────────
      # Conseil : fixe la même version qu'en local (flutter --version)
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # flutter-version: '3.x.x'
          cache: true

      # ── 4. Ruby + Gems ───────────────────────────────────────────────────────
      - name: Setup Ruby & install gems
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: ios

      # ── 4b. Forcer la cible de déploiement iOS (corrige l'erreur CocoaPods) ──
      - name: Force iOS deployment target to 15.0
        working-directory: ios
        run: |
          # Podfile : remplace ou ajoute la ligne platform
          if grep -qE "^[[:space:]]*#?[[:space:]]*platform :ios" Podfile; then
            sed -i '' -E "s/^[[:space:]]*#?[[:space:]]*platform :ios.*/platform :ios, '15.0'/" Podfile
          else
            { echo "platform :ios, '15.0'"; cat Podfile; } > Podfile.new
            mv Podfile.new Podfile
          fi

          # Projet Xcode
          sed -i '' -E "s/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]+;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g" \
            Runner.xcodeproj/project.pbxproj

          # AppFrameworkInfo.plist
          /usr/libexec/PlistBuddy -c "Set :MinimumOSVersion 15.0" Flutter/AppFrameworkInfo.plist || true

          # Lockfile potentiellement généré avec une ancienne cible
          rm -f Podfile.lock

          grep -n "platform :ios" Podfile

      # ── 5. Dart packages ─────────────────────────────────────────────────────
      - name: Install Flutter dependencies
        run: |
          flutter pub get
          flutter precache --ios

      # ── 6. CocoaPods ─────────────────────────────────────────────────────────
      - name: Install CocoaPods
